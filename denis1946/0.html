<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виртуальный счет</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            width: 350px;
            text-align: center;
        }
        .balance {
            font-size: 2rem;
            margin: 20px 0;
            font-weight: bold;
        }
        .btn {
            background-color: #4caf50;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Мой счет</h2>
        <div class="balance"><span id="balance-amount">10650</span> ₽</div>
        <button class="btn" onclick="addMoney()">Пополнить на 2000 ₽</button>
    </div>

    <script>
        let currentBalance = 10650;

        function addMoney() {
            currentBalance += 2000;
            document.getElementById('balance-amount').textContent = currentBalance;
        }
    </script>

</body>
</html>
